services:
  - type: web
    name: flask-docker-app
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: MONGODB_URI
        sync: false
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: app 